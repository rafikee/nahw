name: build-and-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The Pi is arm64, so this builds on a native arm64 runner (free for public
    # repos). It used to build on x86 under QEMU emulation, which crashed
    # intermittently mid-build ("uncaught target signal 4") and left buildkit
    # hanging on a dead process for the full 6h GitHub limit — no image, no
    # Coolify call, a silently un-deployed commit. No emulator, no such crash.
    runs-on: ubuntu-24.04-arm
    # A hang should cost 20 minutes, not 6 hours.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            APP_BUILD=${{ github.run_number }}
            APP_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/rafikee/nahw:latest
            ghcr.io/rafikee/nahw:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify redeploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          curl -fsS -X GET \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "https://coolify.barada.dev/api/v1/deploy?uuid=u8km6isr7bcfonf4xdfuz8rr&force=false"
