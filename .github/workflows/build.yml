name: build-and-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # QEMU-emulated arm64 builds crash intermittently ("uncaught target signal 4")
    # and buildkit then hangs on the dead process rather than failing. One such
    # hang ran the full 6h GitHub limit before anyone noticed, and a hang means no
    # image, no Coolify call, and a silently un-deployed commit. Successful builds
    # take 3-6 minutes, so anything past 20 is that hang. Just re-run it.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/rafikee/nahw:latest
            ghcr.io/rafikee/nahw:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify redeploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          curl -fsS -X GET \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "https://coolify.barada.dev/api/v1/deploy?uuid=u8km6isr7bcfonf4xdfuz8rr&force=false"
