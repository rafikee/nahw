# Content omitted from the app
#
# This file tracks source-book content that we chose not to include
# in the interactive lessons. Each entry records what was cut, which
# lesson/section it belongs to, and why it was left out. We can
# revisit any of these later if the app's scope changes.

- lesson: "01 — أَنْوَاعُ الْكَلِمَاتِ"
  items:

    - title: "Word-length rules (1–7 letters)"
      source: "data/course_intro.json → word_length_rules"
      content: |
        Arabic words can be 1 to 7 letters long, and never longer.
        Examples by length:
          1 letter  — الباء في ﴿بِسْمِ اللَّهِ﴾ / الهمزة في ﴿أَلَمْ نَشْرَحْ لَكَ﴾
          2 letters — مِنْ، فِي
          3 letters — عِنَبٍ، شَجَرٍ
          4 letters — جَدْوَلِ، جَعْفَرٍ
          5 letters — سَفَرْجَلٍ
          6 letters — زَعْفَرَانِ
          7 letters — اسْتِفْهَامٍ
      reason: >
        Interesting trivia but not essential to understanding فعل/اسم/حرف.
        Front-loaded dry material that hurt first-time engagement.

    - title: "Course intro prose (word formation paragraphs)"
      source: "data/course_intro.json → paragraphs"
      content: |
        Three paragraphs explaining that words are composed of
        alphabet letters (alif through yaa), with examples like
        أب، أم، أخ، أخت، اجتهاد، نجاح. The core idea was folded
        into the lesson introduction; the verbose version was cut.
      reason: >
        The key message ("all words come from alphabet letters") is
        already captured in the lesson intro text. The longer version
        added length without adding understanding.

    - title: "Open-ended recall questions"
      source: "data/lesson_1.json (original) → exercises.text_questions[3–4]"
      content: |
        Q4: اذْكُرْ عَشْرَةَ أَفْعَالٍ (Name 10 verbs)
        Q5: اذْكُرْ خَمْسَةَ أَسْمَاءٍ مِنْ أَسْمَاءِ النَّاسِ، وَمِثْلَهَا مِنْ
            أَسْمَاءِ أَجْنَاسِ الْحَيَوَانِ، وَالنَّبَاتِ، وَالْجَمَادِ
            (Name 5 nouns each from people, animals, plants, and objects)
      reason: >
        Pure recall / open-ended prompts that don't translate to a
        deterministic interactive exercise. Suited for oral classroom
        recitation, not a tap-based app.

    - title: "Interactive paragraph (Nile passage)"
      source: "data/lesson_1.json (original) → exercises.interactive_paragraph"
      content: |
        A paragraph about the Nile river with 27 words, each tagged
        as فعل/اسم/حرف. The user tapped each word to reveal its type.
      reason: >
        The reveal-only interaction required zero thinking from the
        learner — there was no wrong answer possible. Replaced by
        the word-sort exercise which requires active classification.

- lesson: "05 — الْكَلَامُ"
  items:

    - title: "Word-counting exercise"
      source: "source-content/vol1-009-038.md → الْكَلَامُ → تَمْرِينٌ, question 3"
      content: |
        كَمْ كَلِمَةً فِي كُلِّ جُمْلَةٍ مِنْ هَذِهِ الْجُمَلِ
        (How many words are in each of these sentences?), over three
        proverb-style sentences.
      reason: >
        Counting words in a sentence tests attention, not the lesson's
        actual idea, which is that a sentence needs two or more words and is
        named by what starts it. As an MCQ it also degrades into arithmetic
        with one defensible answer per sentence, so it would need three
        separate questions to convert at all.

    - title: "Singular/dual/plural identification passage"
      source: "source-content/vol1-009-038.md → الْكَلَامُ → تَمْرِينٌ, question 4"
      content: |
        عَيِّنِ الْمُفْرَدَ وَالْمُثَنَّى وَأَنْوَاعَ الْجَمْعِ فِي الْعِبَارَاتِ الْآتِيَةِ
        followed by a passage about honouring one's parents.
      reason: >
        This is lesson 4's material, not lesson 5's — the textbook uses it as
        spaced review. The app has no cross-lesson review step yet, and
        folding it into this lesson's word sort would have made the sort test
        two unrelated skills at once. Worth revisiting if a review step is
        ever added.

    - title: "Whether كلام must contain all three word types"
      source: "source-content/vol1-009-038.md → الْكَلَامُ, third paragraph + تَمْرِينٌ question 2"
      content: |
        The book notes that كلام need not combine فعل، اسم، حرف — it may be two
        nouns, or a verb and a noun — and its second exercise question asks this
        directly.
      reason: >
        Teaching it properly needed a third box on the lesson's opening screen,
        which is the screen most at risk of carrying too much, and testing it
        without teaching it is exactly what the flow reviewer flags. The two
        worked examples on that screen still demonstrate the point quietly: one
        is two nouns, the other a verb and a noun. Worth restoring if the intro
        screen ever gains room.

- lesson: "04 — الْمُفْرَدُ وَالْمُثَنَّى وَالْجَمْعُ"
  items:

    - title: "Case names in the مثنى quick check explanation"
      source: "data/lesson_4.json (previous) → concepts[1].quick_check.explanation"
      content: |
        الْمُثَنَّى يُصَاغُ بِزِيَادَةِ أَلِفٍ وَنُونٍ (فِي حَالَةِ الرَّفْعِ) أَوْ يَاءٍ وَنُونٍ
        (فِي حَالَةِ النَّصْبِ وَالْجَرِّ) فِي آخِرِ الْمُفْرَدِ.
      reason: >
        الرفع and النصب والجر are case names no lesson had taught, and the book's
        own definition of المثنى gives both forms without them. Restore once
        أَنْوَاعُ الْإِعْرَابِ is a lesson — that is the section that names the cases.
        Lesson 6 (الْمَبْنِيُّ وَالْمُعْرَبُ) is not enough: it shows that a word's ending
        changes but never names what it changes to.

    - title: "The collective name جَمْعُ التَّصْحِيحِ"
      source: "data/lesson_4.json (previous) → intro_bonus"
      content: |
        جَمْعُ الْمُذَكَّرِ وَجَمْعُ الْمُؤَنَّثِ يُسَمَّيَانِ مَعًا جَمْعَ التَّصْحِيحِ.
      reason: >
        It sat in an aside on the lesson's opening screen, naming both sound
        plurals before either had been taught, and a review question then leaned
        on the term. The flow reviewer flagged it as major once it could see the
        screen correctly. The app has no post-concept note step, which is where
        this belongs; restore it if one is ever added.

    - title: "Review question on what words are composed of"
      source: "data/lesson_1.json (previous) → exercises.review_quiz[0]"
      content: |
        مَا الَّذِي يَتَرَكَّبُ مِنَ الْحُرُوفِ الْهِجَائِيَّةِ؟ (What is composed of the
        letters of the alphabet?)
      reason: >
        It tested the word-formation prose that was itself cut from this lesson
        as front-loaded and dry, so the question outlived its content and asked
        about something no screen taught. Replaced with a question on الحرف,
        which the lesson does teach and which the review quiz otherwise skipped.

- lesson: "06 — الْمَبْنِيُّ وَالْمُعْرَبُ"
  items:

    - title: "Recap preamble on how sentences are built from single words"
      source: "source-content/vol1-009-038.md → الْمَبْنِيُّ وَالْمُعْرَبُ, opening paragraph"
      content: |
        سَبَقَ لَكَ أَنَّ الْجُمَلَ الْمُفِيدَةَ تَتَرَكَّبُ مِنَ الْكَلِمَاتِ الْمُفْرَدَةِ، الَّتِي
        تَنْحَصِرُ فِي الْأَنْوَاعِ الثَّلَاثَةِ: الْفِعْلِ وَالْاسْمِ وَالْحُرُوفِ.
      reason: >
        A backward glance at lessons 1 and 5, not new material. The flow
        reviewer flags re-teaching of what an earlier lesson already covered,
        and the introduction's own «عِنْدَ التَّرْكِيبِ» carries the same idea in
        three words.

    - title: "Exercise 2 — «مَا الْمَبْنِيُّ، وَمَا الْمُعْرَبُ؟»"
      source: "source-content/vol1-009-038.md → الْمَبْنِيُّ وَالْمُعْرَبُ, تَمْرِينٌ"
      content: |
        مَا الْمَبْنِيُّ ، وَمَا الْمُعْرَبُ ؟
      reason: >
        Straight definition recall. As an MCQ it would restate the two concept
        screens verbatim with the answer visible; the two per-concept quick
        checks already test the same thing by application. Exercises 1, 3 and 4
        did convert, and are the review quiz.
